# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-contract-regex"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-regex"
description = "Regular-expression content contract: text always, matching a bound pattern when a Location names one, whole or line by line. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sdk = { package = "xmip-core-sdk", git = "https://github.com/IlleNilsson/xmip-core-sdk", branch = "main" }
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

# The one real engine. Finite automata, linear time in the input, so a pattern
# an operator writes cannot be made to hang a Receive Location.
regex = "1"

[dev-dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
